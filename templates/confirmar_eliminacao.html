{% extends "index.html" %}
{% load static %}

{% block content %}
<div style="display:flex; justify-content:center; align-items:center; min-height:60vh; padding: 2rem;">
    <div class="confirm-dialog">
        <div class="dialog-icon">
            <i class="fas fa-trash-alt"></i>
        </div>
        <h2>Confirmar Eliminação</h2>
        <p>Tem a certeza que deseja eliminar este registo?</p>
        <p style="font-weight: 700; color: var(--text-main); font-size: 1rem; margin-bottom: 1.5rem;">{{ registo }}</p>

        <form method="post">
            {% csrf_token %}
            <div class="dialog-actions">
                <a href="javascript:history.back()" class="bt-secondary">
                    <i class="fas fa-times"></i> Cancelar
                </a>
                <button type="submit" class="bt-danger">
                    <i class="fas fa-trash-alt"></i> Sim, Eliminar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
