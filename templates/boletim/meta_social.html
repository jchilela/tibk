<link rel="canonical" href="{{ og_url }}">
<link rel="alternate" hreflang="pt" href="{{ og_url_pt }}">
<link rel="alternate" hreflang="en" href="{{ og_url_en }}">
<link rel="alternate" hreflang="x-default" href="{{ og_url_pt }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ cfg.nome_igreja }}">
<meta property="og:locale" content="{{ t.og_locale }}">
<meta property="og:title" content="{{ og_titulo }}">
<meta property="og:description" content="{{ og_descricao }}">
<meta property="og:url" content="{{ og_url }}">
<meta property="og:image" content="{{ og_imagem }}">
<meta property="og:image:alt" content="{{ cfg.nome_igreja }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ og_titulo }}">
<meta name="twitter:description" content="{{ og_descricao }}">
<meta name="twitter:image" content="{{ og_imagem }}">
