{% extends 'index.html' %}
{% load static %}
{% block content %}

<div class="list-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--primary-light); padding-bottom: 1rem;">
        <div>
            <h2 style="font-family: 'Inter', sans-serif; font-size: 1.75rem; color: var(--text-main);"><i class="fas fa-qrcode"></i> QR Code do Portal de Ocorrências</h2>
        </div>
        <a href="{% url 'sitetibl:gestao_ocorrencias' %}" class="bt-primary" style="padding: 0.5rem 1rem; font-size: 0.85rem; background-color: #64748b;">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>
    </div>

    <div class="filter-bar" style="max-width: 480px; margin: 0 auto 1.5rem; background: white; border: 1px solid #e5e7eb; border-radius: var(--radius-lg); padding: 1rem 1.5rem;">
        <form method="get" style="display: flex; gap: 0.75rem; align-items: center;">
            <label style="font-size: 0.85rem; font-weight: 600; white-space: nowrap;">Local específico:</label>
            <select name="local_id" onchange="this.form.submit()" style="flex: 1; padding: 0.4rem 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.85rem;">
                <option value="">Geral (sem local pré-definido)</option>
                {% for s in sitios %}
                <option value="{{ s.id }}" {% if sitio_selecionado and sitio_selecionado.id == s.id %}selected{% endif %}>{{ s.designacao }}</option>
                {% endfor %}
            </select>
        </form>
    </div>

    <div class="modern-card" style="max-width: 480px; margin: 0 auto; text-align: center; padding: 2.5rem;" id="qr-print-area">
        <img src="{% static 'fotos/2022/cba.png' %}" alt="TIBL" style="width: 60px; margin-bottom: 1rem;">
        <h3 style="margin-bottom: 0.5rem;">Reportar Ocorrência{% if sitio_selecionado %} · {{ sitio_selecionado.designacao }}{% endif %}</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Aponte a câmara do seu telemóvel para o código abaixo</p>

        <img src="{% url 'sitetibl:ocorrencia_qrcode_imagem' %}{% if sitio_selecionado %}?local_id={{ sitio_selecionado.id }}{% endif %}" alt="QR Code" style="width: 260px; height: 260px; border: 1px solid #e5e7eb; border-radius: var(--radius-lg); padding: 1rem;">

        <p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); word-break: break-all;">{{ url_publica }}</p>
    </div>

    <div style="text-align: center; margin-top: 1.5rem;">
        <button type="button" class="bt-primary" onclick="window.print()">
            <i class="fas fa-print"></i> Imprimir QR Code
        </button>
    </div>
</div>

<style>
@media print {
    body * { visibility: hidden; }
    #qr-print-area, #qr-print-area * { visibility: visible; }
    #qr-print-area { position: absolute; left: 0; top: 0; width: 100%; }
}
</style>

{% endblock %}
