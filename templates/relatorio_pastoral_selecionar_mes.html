{% extends "base_modern.html" %}
{% load static %}
{% load verificagrupo %}

{% block title %}Selecionar Mês — Relatório Pastoral{% endblock %}

{% block content %}
<div class="list-container" style="max-width: 520px; margin: 3rem auto;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <i class="fas fa-file-pdf" style="font-size: 2.5rem; color: var(--primary);"></i>
        <h2 style="font-family: 'Inter', sans-serif; font-size: 1.5rem; color: var(--text-main); margin-top: 0.75rem;">Relatório Pastoral Mensal</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Selecione o mês que pretende gerar em PDF.</p>
    </div>

    <form method="get" action="{% url 'sitetibl:relatorio_pastoral_mensal' %}" target="_blank">
        <div style="margin-bottom: 1.5rem;">
            <label for="mes" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.05em;">Mês</label>
            <select name="mes" id="mes" class="form-control" style="width: 100%; padding: 0.6rem 0.9rem; font-size: 1rem; border: 1px solid #d1d5db; border-radius: 6px;">
                {% for opcao in meses_opcoes %}
                <option value="{{ opcao.valor }}">{{ opcao.label }}</option>
                {% endfor %}
            </select>
        </div>
        <div style="display: flex; gap: 0.75rem; justify-content: flex-end;">
            <a href="{% url 'sitetibl:pastoral_dashboard' %}" class="bt-secondary" style="padding: 0.6rem 1.2rem;">
                <i class="fas fa-arrow-left"></i> Voltar
            </a>
            <button type="submit" class="bt-primary" style="padding: 0.6rem 1.4rem;">
                <i class="fas fa-file-pdf"></i> Gerar PDF
            </button>
        </div>
    </form>
</div>
{% endblock %}
