version: '3'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8001:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=tibl.settings
      - DB_NAME=db_qa.sqlite3
      - DEBUG=True
    extra_hosts:
      - "host.docker.internal:host-gateway"
