name: Deploy para Produção

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    name: Build, Push e Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Deploy no servidor via SSH
      - name: Deploy no servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            cd /home/projectotibl/tibk/

            # Actualizar código
            git pull origin production

            # Reconstruir e reiniciar o serviço web
            docker compose build web
            docker compose up -d

            # Aplicar migrações pendentes
            docker compose exec -T web python manage.py migrate --noinput

            # Garantir grupos e permissões actualizados
            docker compose exec -T web python manage.py seed_base_data --skip-admin

            # Remover imagens antigas não referenciadas (liberta espaço)
            docker image prune -f
