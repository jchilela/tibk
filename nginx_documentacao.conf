# Snippet nginx para servir /documentacao/ directamente em produção
# (melhor performance do que passar pela view Django)
#
# Inclua este bloco dentro do seu server {} principal:
#
#   include /caminho/para/nginx_documentacao.conf;

location /documentacao/ {
    alias /app/docs/site/;
    try_files $uri $uri/ $uri/index.html =404;

    # Cache agressivo para assets estáticos
    location ~* \.(css|js|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
